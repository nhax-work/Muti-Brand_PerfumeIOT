# Cấu hình Mosquitto cho môi trường phát triển
#
# CẢNH BÁO: file này cho phép kết nối ẩn danh, CHỈ dùng ở máy dev.
# Môi trường thật bắt buộc TLS + credential riêng từng thiết bị
# (NFR-SEC-02, NFR-SEC-07, FR-IOT-08, FR-IOT-09).

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

max_queued_messages 1000
message_size_limit 65536

# --- Tuần 6 trở đi: bật các dòng dưới, tắt allow_anonymous ---
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl
#
# listener 8883
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
