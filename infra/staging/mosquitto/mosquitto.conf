# Mosquitto cho staging: bắt buộc đăng nhập, mỗi thiết bị chỉ thấy topic của mình
# (NFR-SEC-02, NFR-SEC-07, FR-IOT-08, FR-IOT-09).
#
# passwd và acl nằm ngoài repo, trong thư mục bí mật trên server (infra/staging/init-secrets.sh).
# Chứng chỉ do start.sh chép từ volume của Caddy vào /mosquitto/certs.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/secrets/passwd
acl_file /mosquitto/secrets/acl

# Cổng nội bộ trong mạng Docker, chỉ backend dùng. KHÔNG publish ra ngoài.
listener 1883
protocol mqtt

# Cổng công khai cho ESP32 và Device Simulator.
listener 8883
protocol mqtt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

max_queued_messages 1000
message_size_limit 65536
