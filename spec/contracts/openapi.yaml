openapi: 3.1.0

# =====================================================================================
# CONTRACT ĐÓNG BĂNG. Không sửa trực tiếp.
# Muốn đổi: viết ADR trong spec/decisions/, TV1 duyệt, rồi sửa và chạy `make test-contract`
# (spec/contracts/README.md).
#
# Phạm vi: toàn bộ FR ưu tiên M của 17 module. FR ưu tiên S/W không có endpoint ở đây.
# Mỗi operation mở đầu `description` bằng mã FR để đối chiếu ma trận truy vết.
#
# Enum trong components.schemas PHẢI trùng từng giá trị với enum trong spec/contracts/schema.sql.
# Mã lỗi PHẢI nằm trong spec/errors.md — không được đặt mã mới ở đây.
# Ngưỡng số tham chiếu tên hằng trong spec/constraints.md — không viết số vào mô tả.
# =====================================================================================

info:
  title: ScentStation API
  version: 1.0.0
  description: |
    REST API của nền tảng ScentStation — máy trải nghiệm nước hoa theo mô hình cho thuê slot.

    ## Cô lập dữ liệu ở mức slot

    Người dùng thuộc thương hiệu chỉ thấy dữ liệu của slot mà thương hiệu đó đang hoặc đã từng có
    hóa đơn, trong đúng kỳ hạn hóa đơn tương ứng (BR-003, BR-012, FR-AUTH-07, FR-BND-05).

    Mọi endpoint có dữ liệu thương hiệu phải lọc qua `orders`/`slot_rentals`, **không bao giờ qua
    `machines`** — `machines` không có `brand_id` vì một máy chứa slot của nhiều thương hiệu. Ngoài
    phạm vi trả `FORBIDDEN_SCOPE` (403).

    Đơn hàng có `revenueOwner = PLATFORM` (hàng đã thanh lý) **không** hiển thị cho Brand Admin
    (FR-REV-06, FR-EXP-20) — lọc theo `revenueOwner`, không phải chỉ theo `brandId`.

    ## Bốn vai trò

    `PLATFORM_SUPER_ADMIN` · `OPERATIONS_STAFF` · `INVENTORY_STAFF` · `BRAND_ADMIN`

    ## Xác thực

    Bearer JWT. Access token hết hạn sau `ACCESS_TOKEN_TTL_MIN`, refresh token sau
    `REFRESH_TOKEN_TTL_DAYS` (FR-AUTH-02). Endpoint kiosk là công khai, đánh dấu `security: []`.

    Thao tác nhạy cảm (hoàn tiền, điều chỉnh tồn kho, xịt chẩn đoán, thanh lý, đổi cấu hình máy)
    cần header `X-Reauth-Token` lấy từ `POST /auth/reauth`, thiếu thì trả `REAUTH_REQUIRED`
    (FR-AUTH-09).

    ## Quy ước chung

    - Thời điểm: ISO-8601 có offset, lưu ở UTC (NFR-DAT-01).
    - Tiền: chuỗi thập phân (`"35000.0000"`) để không mất chính xác khi qua JSON (NFR-DAT-02).
    - Danh sách: phân trang bằng `page` và `pageSize`, trả kèm `total`.
    - Lỗi: luôn có dạng `{ code, message, details? }`; `code` lấy từ `spec/errors.md`.
  contact:
    name: Nhóm FA26SE114

