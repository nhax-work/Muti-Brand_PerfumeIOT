# Hạ tầng phát triển ScentStation
# Chạy: docker compose up -d
#
# Chỉ chứa hạ tầng, không chứa ứng dụng. Thêm service `api` khi đã chọn ngôn ngữ.

services:
  db:
    image: postgres:16-alpine
    container_name: scent-db
    environment:
      POSTGRES_USER: ${DB_USER:-scent}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-scent_dev}
      POSTGRES_DB: ${DB_NAME:-scentstation}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-scent} -d ${DB_NAME:-scentstation}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: scent-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    container_name: scent-mqtt
    ports:
      - "${MQTT_PORT:-1883}:1883"      # dev: không TLS
      - "${MQTT_WS_PORT:-9001}:9001"   # websocket, tiện debug
    volumes:
      - ./infra/mosquitto/config:/mosquitto/config
      - mqtt_data:/mosquitto/data
      - mqtt_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -t '$$SYS/#' -C 1 -W 3 -q 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: scent-adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # CSDL riêng cho test, không dùng chung với dev
  db-test:
    image: postgres:16-alpine
    container_name: scent-db-test
    environment:
      POSTGRES_USER: scent
      POSTGRES_PASSWORD: scent_test
      POSTGRES_DB: scentstation_test
      TZ: UTC
    ports:
      - "${DB_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data   # chạy trên RAM, test nhanh hơn
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scent -d scentstation_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  # TODO tuần 2: thêm service `api` sau khi chốt ngôn ngữ backend
  # api:
  #   build: .
  #   depends_on:
  #     db: { condition: service_healthy }
  #     redis: { condition: service_healthy }
  #     mqtt: { condition: service_healthy }

volumes:
  db_data:
  redis_data:
  mqtt_data:
  mqtt_log:
