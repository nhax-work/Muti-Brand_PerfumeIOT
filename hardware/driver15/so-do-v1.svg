<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1120" viewBox="0 0 1500 1120">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="none" stroke="#475569"/></marker></defs>
<rect width="1500" height="1120" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172033} .title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#475569}.head{font-size:19px;font-weight:700}.body{font-size:16px}.wire{fill:none;stroke:#475569;stroke-width:2;marker-end:url(#arrow)}</style>
<text x="40" y="48" class="title">ScentStation • Bo điều khiển V1</text>
<text x="40" y="78" class="sub">5 bơm + 5 van + 5 đèn + 5 nút | ESP32-WROOM-32D | Không dùng load cell</text>
<rect x="40" y="105" width="1420" height="58" rx="12" fill="#fef3c7" stroke="#94a3b8"/>
<text x="58" y="135" class="head">BẢN RÀ SOÁT CHỨC NĂNG — chưa đi dây PCB, chưa xuất Gerber</text>
<rect x="40" y="195" width="280" height="145" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="58" y="225" class="head">Nguồn vào 12 VDC</text>
<text x="58" y="254" class="body">J_PWR → cầu chì F1</text>
<text x="58" y="279" class="body">Chống ngược cực / TVS: TBD</text>
<text x="58" y="304" class="body">Tụ bus: 1000 µF / 25 V*</text>
<rect x="390" y="195" width="300" height="145" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="408" y="225" class="head">Nguồn logic</text>
<text x="408" y="254" class="body">Buck 12 V → 5 V: TBD</text>
<text x="408" y="279" class="body">5 V → ESP / AHCT541</text>
<text x="408" y="304" class="body">3V3 → PCF8575</text>
<rect x="760" y="195" width="340" height="145" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="778" y="225" class="head">Bus +12V_LOAD</text>
<text x="778" y="254" class="body">Tới chân 1 của 15 đầu tải</text>
<text x="778" y="279" class="body">Âm tải → Drain MOSFET</text>
<text x="778" y="304" class="body">GND công suất về nguồn</text>
<rect x="1150" y="195" width="310" height="145" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="1168" y="225" class="head">Ngắt nguồn tải</text>
<text x="1168" y="254" class="body">Dừng khẩn DC: TBD</text>
<text x="1168" y="279" class="body">Đo dòng khởi động bơm</text>
<text x="1168" y="304" class="body">F1 5 A: chưa chốt</text>
<polyline points="320,235 390,235" class="wire"/>
<polyline points="320,310 350,310 350,360 930,360 930,340" class="wire"/>
<rect x="40" y="400" width="360" height="230" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="58" y="430" class="head">ESP32 • giữ chân đang dùng</text>
<text x="58" y="459" class="body">Bơm: 25 / 18 / 19 / 21 / 22</text>
<text x="58" y="484" class="body">Đèn: 26 / 23 / 32 / 33 / 13</text>
<text x="58" y="509" class="body">Nút: 27 / 34 / 35 / 36 / 39</text>
<text x="58" y="534" class="body">I²C: SDA16 / SCL17</text>
<text x="58" y="559" class="body">RUN_REQUEST: GPIO14</text>
<rect x="460" y="400" width="350" height="230" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="478" y="430" class="head">PCF8575 • 3V3 • 0x20</text>
<text x="478" y="459" class="body">P00..04 → U5 đảo → VAN1..5</text>
<text x="478" y="484" class="body">P05 → U5 đảo → EXP_READY</text>
<text x="478" y="509" class="body">SDA/SCL: kéo lên 3V3 4,7 kΩ*</text>
<text x="478" y="534" class="body">U5 AHCT04: 5 V, 6 cổng đảo</text>
<text x="478" y="559" class="body">Pxx=1: tắt; Pxx=0: bật</text>
<rect x="880" y="400" width="580" height="230" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="898" y="430" class="head">U1 / U2 • SN74AHCT541 • nguồn 5 V</text>
<text x="898" y="459" class="body">U1 A1..5: BƠM1..5 | A6..8: VAN1..3</text>
<text x="898" y="484" class="body">U2 A1..2: VAN4..5 | A3..7: ĐÈN1..5</text>
<text x="898" y="509" class="body">U2 A8 → GND; Y8 không nối</text>
<text x="898" y="534" class="body">15 ngõ ra → RG 1 kΩ* → Gate MOSFET</text>
<text x="898" y="559" class="body">/OE chung: kéo lên 5 V = vô hiệu tải</text>
<polyline points="400,458 460,458" class="wire"/>
<polyline points="810,465 880,465" class="wire"/>
<polyline points="400,420 425,420 425,375 1170,375 1170,400" class="wire"/>
<rect x="40" y="680" width="440" height="185" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="58" y="710" class="head">Cho phép tải • mặc định TẮT</text>
<text x="58" y="739" class="body">RUN_REQUEST AND EXP_READY</text>
<text x="58" y="764" class="body">→ 2 NPN nối tiếp kéo /OE xuống</text>
<text x="58" y="789" class="body">Gate mỗi MOSFET kéo xuống 10 kΩ*</text>
<text x="58" y="814" class="body">Watchdog độc lập: chưa chọn</text>
<rect x="540" y="680" width="460" height="185" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="558" y="710" class="head">Một kênh tải ×15</text>
<text x="558" y="739" class="body">+12V_LOAD → tải → Drain AOD4184A</text>
<text x="558" y="764" class="body">Source → GND_PWR; Gate ← buffer</text>
<text x="558" y="789" class="body">Bơm/van: diode song song tải</text>
<text x="558" y="814" class="body">Cathode → +12V; Anode → Drain</text>
<rect x="1060" y="680" width="400" height="185" rx="12" fill="#e0f2fe" stroke="#94a3b8"/>
<text x="1078" y="710" class="head">5 đầu nối nút</text>
<text x="1078" y="739" class="body">COM → GND; NO → GPIO nút</text>
<text x="1078" y="764" class="body">NO kéo lên 3V3 qua 10 kΩ</text>
<text x="1078" y="789" class="body">NC không nối</text>
<text x="1078" y="814" class="body">LED 12 V dùng kênh đèn riêng</text>
<polyline points="1170,630 1170,655 770,655 770,680" class="wire"/>
<polyline points="260,680 260,655 1435,655 1435,630" class="wire"/>
<rect x="40" y="910" width="1420" height="165" rx="12" fill="#fff7ed" stroke="#94a3b8"/>
<text x="58" y="940" class="head">Cần chốt trước khi sản xuất</text>
<text x="58" y="969" class="body">* Giá trị ứng viên, phải đo kiểm. Chưa có sơ đồ EDA, ERC, layout hoặc DRC.</text>
<text x="58" y="994" class="body">Chọn buck, bảo vệ nguồn, diode bơm, watchdog và đầu nối; đo socket ESP, kích thước bo và dòng tải.</text>
<text x="58" y="1019" class="body">Firmware hiện tại chưa điều khiển van / MCP / RUN_REQUEST. Không cắm bo theo sơ đồ này để chạy ngay.</text>
<text x="58" y="1044" class="body">Chi tiết kết nối và trình tự khởi động: THIET_KE_V1.md | Bảng kênh: kenh-v1.csv</text>
</svg>